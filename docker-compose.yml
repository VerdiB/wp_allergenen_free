services:
  wordpresslatest:
    image: "wordpress:latest"
    # pull_policy: "always"
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
        restart: true
        required: true
      phpmyadmin:
        condition: service_started
        required: true
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ""
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: true
      WORDPRESS_DEBUG_LOG: true
    volumes:
      - ./allergens-dietary:/var/www/html/wp-content/plugins/allergens-dietary
      - ./phpunit/tests:/var/www/html/wordpress-tests/
      - ./wordpress:/var/www/html/
      - ./debug:/var/www/html/wp-content/logs
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./error-logging.ini:/usr/local/etc/php/conf.d/error-logging.ini
    networks:
      allergen:
        ipv4_address: "124.168.94.20"

  wordpresstest:
    image: "wordpress:latest"
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ""
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      allergen:
        ipv4_address: "124.168.94.19"

  db:
    image: "mysql:latest"
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      allergen:
        ipv4_address: "124.168.94.21"

  phpmyadmin:
    image: "phpmyadmin:latest"
    ports:
      - "8181:80"
    depends_on:
      - db
    environment:
      PMA_PORT: 3306
      PMA_HOST: db
    networks:
      allergen:
        ipv4_address: "124.168.94.22"

  testdb:
    image: "mysql:latest"
    environment:
      MYSQL_DATABASE: testdb
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_TCP_PORT: 3307
    networks:
      allergenTests:
        ipv4_address: "125.168.94.21"

  phpunit:
    build:
      context: .
      dockerfile: phpunit/Dockerfile
    volumes:
      - ./allergens-dietary:/var/www/html/wp-content/plugins/allergens-dietary
      - ./phpunit/tests:/var/www/html/wordpress-tests/
      # - ./wordpress:/var/www/html/
    depends_on:
      - wordpresslatest
      - testdb
    networks:
      allergenTests:

networks:
  allergen:
    ipam:
      driver: default
      config:
        - subnet: "124.168.94.0/24"
  allergenTests:
    ipam: 
      driver: default
      config:
        - subnet: "125.168.94.0/24"
